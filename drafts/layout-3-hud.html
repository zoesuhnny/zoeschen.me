<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layout 3 — HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/common.css" />
<style>
  /* Layout 3 accent: blue-leaning steel teal */
  :root {
    --accent: #4f8fa6;
    --accent-soft: #8fcbdb;
  }

  body {
    height: 100dvh;
    background-image: radial-gradient(circle, #1a212b 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -11px -11px;
  }

  .dashboard {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: 1.75rem;
    gap: 1rem;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .topbar .name {
    color: var(--ink);
    font-weight: 600;
    font-size: 0.85rem;
  }
  .topbar .readout { display: flex; gap: 1.5rem; }
  .topbar .readout span { color: var(--accent-soft); }

  .panels {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1rem;
    min-height: 0;
  }

  .panel {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 1.1rem 1.25rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.25s ease;
  }
  .panel:hover { border-color: var(--accent); }

  .corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--accent);
    opacity: 0.5;
    transition: opacity 0.25s ease;
  }
  .panel:hover .corner { opacity: 1; }
  .corner.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
  .corner.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

  .panel h4 {
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin: 0 0 0.75rem;
    font-weight: 500;
  }
  .panel p { font-size: 0.78rem; color: var(--muted); line-height: 1.6; margin: 0; max-width: 44ch; }

  .row { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 0.35rem 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: none; }
  .row a { color: var(--ink); transition: color 0.2s ease; }
  .row a:hover { color: var(--accent-soft); }
  .row .yr { color: var(--muted); font-size: 0.68rem; }

  .contact-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: auto; }
  .contact-list a { font-size: 0.8rem; color: var(--ink); transition: color 0.2s ease; }
  .contact-list a:hover { color: var(--accent-soft); }

  .status-metric { font-size: 1.6rem; color: var(--ink); font-weight: 600; margin-top: auto; }
  .status-metric .unit { font-size: 0.7rem; color: var(--muted); font-weight: 400; margin-left: 0.4rem; }
</style>
</head>
<body>
  <div class="cursor-dot" id="cursor"><span class="cursor-label" id="cursor-label"></span></div>

  <div class="dashboard">
    <div class="topbar">
      <span class="name" data-scramble data-cursor="home">YOUR_NAME</span>
      <div class="readout">
        <span>STATUS: <span id="status-text">AVAILABLE</span></span>
        <span id="clock">--:--:--</span>
      </div>
    </div>

    <div class="panels">
      <!-- IDENTITY -->
      <div class="panel">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <h4>IDENTITY</h4>
        <p>Design engineer / builder. I build things at the edge of code and craft — kept short so nothing here ever needs to scroll.</p>
      </div>

      <!-- WORK LOG -->
      <div class="panel">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <h4>WORK LOG</h4>
        <div class="row"><a href="#" data-scramble data-cursor="open">Project One</a><span class="yr">2026</span></div>
        <div class="row"><a href="#" data-scramble data-cursor="open">Project Two</a><span class="yr">2025</span></div>
      </div>

      <!-- TRANSMISSION / contact -->
      <div class="panel">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <h4>TRANSMISSION</h4>
        <div class="contact-list">
          <a href="mailto:you@example.com" data-scramble data-cursor="email">Email</a>
          <a href="#" data-scramble data-cursor="visit">GitHub</a>
          <a href="#" data-scramble data-cursor="visit">LinkedIn</a>
        </div>
      </div>

      <!-- SESSION / live counter -->
      <div class="panel">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <h4>SESSION</h4>
        <p>Time on this page</p>
        <div class="status-metric"><span id="session-time">00:00</span><span class="unit">MIN:SEC</span></div>
      </div>
    </div>
  </div>

  <script src="../assets/common.js"></script>
  <script>
    // Real local clock — genuine live data, not decoration.
    function tick() {
      const el = document.getElementById('clock');
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour12: false });
    }
    tick();
    setInterval(tick, 1000);

    // Real elapsed-time-on-page counter for the SESSION panel.
    const start = Date.now();
    setInterval(() => {
      const el = document.getElementById('session-time');
      if (!el) return;
      const elapsed = Math.floor((Date.now() - start) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      el.textContent = `${m}:${s}`;
    }, 1000);
  </script>
</body>
</html>
