<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal site — layout options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/common.css" />
<style>
  :root { --accent: #7f9fd6; --accent-soft: #b6c8ec; }
  .cursor-dot { width: 7px; height: 7px; }
  .cursor-dot .cursor-label { display: none; }
  body { height: 100dvh; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
  .list { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 440px; padding: 0 2rem; }
  h1 { font-size: 0.9rem; color: var(--muted); font-weight: 500; margin: 0 0 0.5rem; }
  a.opt {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.9rem 1.1rem; border: 1px solid var(--line); color: var(--ink);
    font-size: 0.85rem; transition: border-color 0.2s ease, color 0.2s ease;
  }
  a.opt:hover { border-color: var(--accent); color: var(--accent-soft); }
  a.opt span.n { color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
  <div class="cursor-dot" id="cursor"><span class="cursor-label" id="cursor-label"></span></div>
  <div class="list">
    <h1>Pick a layout to preview</h1>
    <a class="opt" href="personal-1-prompt.html"><span data-scramble>Prompt card</span><span class="n">01</span></a>
    <a class="opt" href="personal-2-split.html"><span data-scramble>Split dossier</span><span class="n">02</span></a>
    <a class="opt" href="personal-3-minimal.html"><span data-scramble>Minimal centered</span><span class="n">03</span></a>
    <a class="opt" href="personal-4-hud.html"><span data-scramble>HUD panels</span><span class="n">04</span></a>
    <a class="opt" href="personal-5-split-hud.html"><span data-scramble>Split + HUD (populated)</span><span class="n">05</span></a>
    <a class="opt" href="personal-6-hud.html"><span data-scramble>HUD, tinted + retro cursor</span><span class="n">06</span></a>
    <a class="opt" href="personal-8-cards.html"><span data-scramble>Systems cards + pictograms</span><span class="n">08</span></a>
    <a class="opt" href="personal-9-mosaic.html"><span data-scramble>Instrument mosaic grid</span><span class="n">09</span></a>
  </div>
  <script src="../assets/common.js"></script>
</body>
</html>
